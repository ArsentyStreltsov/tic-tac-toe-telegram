<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-нолики</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1c1c1c;
            color: white;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
        }

        .game-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cell {
            width: 80px;
            height: 80px;
            background: #2c2c2c;
            border: none;
            border-radius: 10px;
            font-size: 40px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .cell:hover {
            background: #3c3c3c;
        }

        .cell.x {
            color: #ff4b4b;
        }

        .cell.o {
            color: #4b9eff;
        }

        .status {
            font-size: 20px;
            margin-bottom: 20px;
            color: #fff;
        }

        .restart-btn {
            padding: 12px 24px;
            font-size: 16px;
            background: #4b9eff;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .restart-btn:hover {
            background: #3b8eef;
        }

        .winner {
            animation: winner-animation 1s ease infinite;
        }

        @keyframes winner-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="game-title">Крестики-нолики</div>
    <div class="status">Ход: X</div>
    <div class="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>
    <button class="restart-btn">Начать заново</button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const board = document.querySelector('.board');
            const cells = document.querySelectorAll('.cell');
            const status = document.querySelector('.status');
            const restartBtn = document.querySelector('.restart-btn');
            let currentPlayer = 'X';
            let gameBoard = Array(9).fill('');
            let gameActive = true;

            const winningCombinations = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // Горизонтальные
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // Вертикальные
                [0, 4, 8], [2, 4, 6] // Диагональные
            ];

            const handleCellClick = (e) => {
                const cell = e.target;
                const index = cell.dataset.index;

                if (gameBoard[index] || !gameActive) return;

                gameBoard[index] = currentPlayer;
                cell.textContent = currentPlayer;
                cell.classList.add(currentPlayer.toLowerCase());

                if (checkWin()) {
                    status.textContent = `Победитель: ${currentPlayer}!`;
                    gameActive = false;
                    highlightWinner();
                    return;
                }

                if (checkDraw()) {
                    status.textContent = 'Ничья!';
                    gameActive = false;
                    return;
                }

                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                status.textContent = `Ход: ${currentPlayer}`;
            };

            const checkWin = () => {
                return winningCombinations.some(combination => {
                    return combination.every(index => {
                        return gameBoard[index] === currentPlayer;
                    });
                });
            };

            const checkDraw = () => {
                return gameBoard.every(cell => cell !== '');
            };

            const highlightWinner = () => {
                winningCombinations.forEach(combination => {
                    if (combination.every(index => gameBoard[index] === currentPlayer)) {
                        combination.forEach(index => {
                            cells[index].classList.add('winner');
                        });
                    }
                });
            };

            const restartGame = () => {
                gameBoard = Array(9).fill('');
                gameActive = true;
                currentPlayer = 'X';
                status.textContent = 'Ход: X';
                cells.forEach(cell => {
                    cell.textContent = '';
                    cell.classList.remove('x', 'o', 'winner');
                });
            };

            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });

            restartBtn.addEventListener('click', restartGame);

            // Интеграция с Telegram WebApp
            if (window.Telegram && window.Telegram.WebApp) {
                const webApp = window.Telegram.WebApp;
                webApp.ready();
                webApp.expand();
            }
        });
    </script>
</body>
</html>
