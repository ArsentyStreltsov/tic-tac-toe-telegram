<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-нолики</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1c1c1c;
            color: white;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
        }

        .game-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
        }

        .waiting-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 20px;
        }

        .ready-btn {
            padding: 12px 24px;
            font-size: 16px;
            background: #4b9eff;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 10px;
        }

        .ready-btn:hover {
            background: #3b8eef;
        }

        .ready-btn.active {
            background: #2ecc71;
        }

        .board {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cell {
            width: 80px;
            height: 80px;
            background: #2c2c2c;
            border: none;
            border-radius: 10px;
            font-size: 40px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .cell:hover {
            background: #3c3c3c;
        }

        .cell.x {
            color: #ff4b4b;
        }

        .cell.o {
            color: #4b9eff;
        }

        .status {
            font-size: 20px;
            margin-bottom: 20px;
            color: #fff;
        }

        .winner {
            animation: winner-animation 1s ease infinite;
        }

        @keyframes winner-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="game-title">Крестики-нолики</div>
    
    <div class="waiting-screen" id="waitingScreen">
        <p>Ожидание игроков...</p>
        <button class="ready-btn" id="readyBtn">Я готов!</button>
        <p id="playersStatus">Готовы: 0/2</p>
    </div>

    <div class="status" id="gameStatus">Ожидание хода...</div>
    <div class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
    </div>

    <script>
        // Проверяем, запущено ли приложение в Telegram
        if (!window.Telegram || !window.Telegram.WebApp) {
            document.body.innerHTML = '<div style="text-align: center; padding: 20px;">Это приложение можно открыть только в Telegram</div>';
            throw new Error('WebApp не инициализирован');
        }

        let tg = window.Telegram.WebApp;
        let gameStatus = document.getElementById('gameStatus');

        // Ждем полной инициализации WebApp
        window.addEventListener('load', function() {
            try {
                // Инициализация Telegram WebApp
                console.log('Начинаем инициализацию WebApp...');
                
                tg.ready();
                console.log('WebApp.ready() выполнен');
                
                tg.expand();
                console.log('WebApp.expand() выполнен');

                // Отладочная информация
                console.log('=== Данные инициализации ===');
                console.log('Init data:', tg.initData);
                console.log('Init data unsafe:', tg.initDataUnsafe);
                console.log('Platform:', tg.platform);
                console.log('Version:', tg.version);
                console.log('=== Конец данных инициализации ===');
                
                if (!tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                    console.error('Ошибка: данные пользователя недоступны');
                    console.log('Полные данные initDataUnsafe:', JSON.stringify(tg.initDataUnsafe));
                    gameStatus.textContent = 'Ошибка инициализации. Попробуйте открыть игру через Telegram.';
                    return;
                }

                console.log('User:', tg.initDataUnsafe.user);
                
                // Инициализация игровых элементов
                initializeGame();
            } catch (error) {
                console.error('Ошибка при инициализации:', error);
                gameStatus.textContent = 'Произошла ошибка при инициализации: ' + error.message;
            }
        });

        function initializeGame() {
            let currentPlayer = '';
            let gameActive = false;
            let myTurn = false;
            let gameBoard = Array(9).fill('');
            
            const board = document.getElementById('board');
            const cells = document.querySelectorAll('.cell');
            const status = document.getElementById('gameStatus');
            const waitingScreen = document.getElementById('waitingScreen');
            const readyBtn = document.getElementById('readyBtn');
            const playersStatus = document.getElementById('playersStatus');

            // Обработчик нажатия кнопки "Готов"
            readyBtn.addEventListener('click', () => {
                try {
                    console.log('Ready button clicked');
                    readyBtn.classList.add('active');
                    readyBtn.disabled = true;

                    // Отправляем сообщение боту о готовности
                    const data = {
                        action: 'ready'
                    };
                    console.log('Отправляем данные:', data);
                    tg.sendData(JSON.stringify(data));
                    console.log('Данные отправлены');
                } catch (error) {
                    console.error('Ошибка при отправке данных:', error);
                    status.textContent = 'Ошибка при отправке данных: ' + error.message;
                }
            });

            // Обработчик хода
            const handleCellClick = (index) => {
                if (!gameActive || !myTurn || gameBoard[index]) return;

                try {
                    console.log('Cell clicked:', index);
                    // Отправляем ход боту
                    const data = {
                        action: 'move',
                        index: index
                    };
                    console.log('Отправляем ход:', data);
                    tg.sendData(JSON.stringify(data));
                    console.log('Ход отправлен');
                } catch (error) {
                    console.error('Ошибка при отправке хода:', error);
                    status.textContent = 'Ошибка при отправке хода: ' + error.message;
                }
            };

            // Обработчик получения данных от бота
            tg.onEvent('mainButtonClicked', function() {
                console.log('Main button clicked');
            });

            // Обработчик сообщений от основного приложения
            window.addEventListener('message', function(event) {
                console.log('Получено сообщение:', event.data);
                
                // Игнорируем сообщения от React DevTools
                if (event.data.source && event.data.source.includes('react-devtools')) {
                    return;
                }

                try {
                    const data = JSON.parse(event.data);
                    console.log('Обработанное сообщение:', data);
                    
                    switch(data.type) {
                        case 'gameStart':
                            console.log('Начало игры:', data);
                            gameActive = true;
                            currentPlayer = data.symbol;
                            myTurn = data.symbol === 'X';
                            waitingScreen.style.display = 'none';
                            board.style.display = 'grid';
                            status.textContent = myTurn ? 'Ваш ход' : 'Ход противника';
                            break;

                        case 'move':
                            console.log('Получен ход:', data);
                            gameBoard[data.index] = data.symbol;
                            cells[data.index].textContent = data.symbol;
                            cells[data.index].classList.add(data.symbol.toLowerCase());
                            myTurn = data.symbol !== currentPlayer;
                            status.textContent = myTurn ? 'Ваш ход' : 'Ход противника';
                            break;

                        case 'gameEnd':
                            console.log('Конец игры:', data);
                            gameActive = false;
                            status.textContent = data.message;
                            if (data.winner && data.winningCombination) {
                                data.winningCombination.forEach(index => {
                                    cells[index].classList.add('winner');
                                });
                            }
                            break;

                        case 'playersUpdate':
                            console.log('Обновление игроков:', data);
                            playersStatus.textContent = `Готовы: ${data.readyCount}/2`;
                            break;

                        case 'error':
                            console.log('Ошибка:', data);
                            status.textContent = data.message;
                            break;
                    }
                } catch (error) {
                    // Игнорируем ошибки парсинга для сообщений, которые не являются JSON
                    if (!event.data.source) {
                        console.error('Ошибка обработки сообщения:', error);
                        status.textContent = 'Ошибка обработки сообщения: ' + error.message;
                    }
                }
            });

            // Добавляем обработчики клика на ячейки
            cells.forEach((cell, index) => {
                cell.addEventListener('click', () => handleCellClick(index));
            });

            // Обработчик ошибок
            tg.onEvent('error', function(error) {
                console.error('WebApp error:', error);
                status.textContent = 'Произошла ошибка. Попробуйте перезапустить игру.';
            });
        }
    </script>
</body>
</html>
